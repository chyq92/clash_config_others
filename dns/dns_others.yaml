dns:
  enable: true   #DNS开关(false/true)
  listen: 0.0.0.0:53   #DNS监听地址
  ipv6: false    #IP6解析开关；如果为false，将返回ip6结果为空
  use-hosts: true   #查询hosts配置并返回真实IP

  default-nameserver:
      - 223.5.5.5
      - 119.29.29.29
  nameserver-policy:
    'geosite:private':
      - 127.0.0.1
    'geosite:gfw':
      - https://cloudflare-dns.com/dns-query#RULES
      - https://dns.google/dns-query#RULES
  nameserver:
      - https://dns.alidns.com/dns-query
      - https://doh.pub/dns-query

  proxy-server-nameserver-policy:
    '*.bestvmr.com': 47.110.75.65:8053
  proxy-server-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  respect-rules: false

  # direct-nameserver:
  #   - 223.5.5.5
  #   - 119.29.29.29
  # direct-nameserver-follow-policy: false

  enhanced-mode: fake-ip   #DNS模式(redir-host/fake-ip)。【Meta专属】redir-host传递域名，可远程解析
  fake-ip-range: 198.18.0.1/16   #Fake-IP解析地址池
  fake-ip-filter-mode: blacklist
  fake-ip-filter:   #Fake-ip过滤，列表中的域名返回真实ip
    #LAN
    - '*.lan'
    - '*.localdomain'
    - '*.example'
    - '*.invalid'
    - '*.localhost'
    - '*.test'
    - '*.local'
    - '*.home.arpa'
    #放行NTP服务
    - 'time.*.com'
    - 'time.*.gov'
    - 'time.*.edu.cn'
    - 'time.*.apple.com'
    - time-ios.apple.com
    - 'time1.*.com'
    - 'time2.*.com'
    - 'time3.*.com'
    - 'time4.*.com'
    - 'time5.*.com'
    - 'time6.*.com'
    - 'time7.*.com'
    - 'ntp.*.com'
    - 'ntp1.*.com'
    - 'ntp2.*.com'
    - 'ntp3.*.com'
    - 'ntp4.*.com'
    - 'ntp5.*.com'
    - 'ntp6.*.com'
    - 'ntp7.*.com'
    - '*.time.edu.cn'
    - '*.ntp.org.cn'
    - '+.pool.ntp.org'
    - time1.cloud.tencent.com
    # QNAP
    - '*.myqnapcloud.io'
    - '+.myqnapcloud.com'
    # Other
    - 'geosite:private'
    - 'geosite:cn'

  # fallback:          #回落DNS服务器，支持udp/tcp/dot/doh/doq
  #   - https://dns.google/dns-query
  #   - https://one.one.one.one/dns-query

  # fallback-filter:   #回落DNS服务器过滤
  #   geoip: true      #为真时，不匹配为geoip规则的使用fallback返回结果
  #   geoip-code: CN   #geoip匹配区域设定
  #   geosite:         #【Meta专属】设定geosite某分类使用fallback返回结果
  #     - gfw
