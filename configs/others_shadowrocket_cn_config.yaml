- name: 📈 网络测试
  type: select
  proxies:
  - 🎯 全球直连
  - 🚀 节点选择
  - ♻️ 自动选择
  - 🇭🇰 香港节点
  - 🇹🇼 台湾节点
  - 🇯🇵 日本节点
