- name: 🐸 手动切换
  type: select
  include-all: true
- name: ♻️ 自动选择
  type: url-test
  include-all: true
  url: https://cp.cloudflare.com/generate_204
  interval: 300
  tolerance: 50
- name: 🎯 全球直连
  type: select
  proxies:
  - DIRECT
- name: 🛑 广告拦截
  type: select
  proxies:
  - REJECT
  - DIRECT
  # ----------------国家或地区策略组---------------------
- name: 🇭🇰 香港节点
  type: url-test
  include-all: true
  url: https://cp.cloudflare.com/generate_204
  interval: 300
  tolerance: 50
  filter: (?i)(港|HK|hk|Hong Kong|HongKong|hongkong)
- name: 🇹🇼 台湾节点
  type: url-test
  include-all: true
  url: https://cp.cloudflare.com/generate_204
  interval: 300
  tolerance: 50
  filter: (?i)(台|新北|彰化|TW|tw|Taiwan)
- name: 🇯🇵 日本节点
  type: url-test
  include-all: true
  url: https://cp.cloudflare.com/generate_204
  interval: 300
  tolerance: 50
  filter: (?i)(日本|川日|东京|大阪|泉日|埼玉|沪日|深日|JP|jp|Japan)
- name: 🇸🇬 新加坡节点
  type: url-test
  include-all: true
  url: https://cp.cloudflare.com/generate_204
  interval: 300
  tolerance: 50
  filter: (?i)(新加坡|坡|狮城|SG|sg|Singapore)
- name: 🇺🇸 美国节点
  type: url-test
  include-all: true
  url: https://cp.cloudflare.com/generate_204
  interval: 300
  tolerance: 50
  filter: (?i)(美|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|US|us|United States)
- name: 🌐 其他地区
  type: select
  include-all: true
  url: https://cp.cloudflare.com/generate_204
  interval: 300
  tolerance: 50
  filter: ^(?!.*(?i:(港|台|日|坡|美|官|剩余|距离|套餐))).*$

- name: 🤖 AI自动
  type: url-test
  include-all: true
  url: https://cp.cloudflare.com/generate_204
  interval: 300
  tolerance: 100
  filter: ^(?!.*(?i:(港|俄|官|剩余|距离|套餐))).*$
